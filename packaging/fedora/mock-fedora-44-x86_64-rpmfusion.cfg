"""
mock config: fedora-44-x86_64 + RPM Fusion Free enabled.

BambuStudio's Fedora BuildRequires list (linux.d/fedora in this repo) needs
x264-devel and gstreamer1-plugin-openh264, which live in RPM Fusion Free, not
base Fedora. Mock's stock fedora-44-x86_64 template doesn't enable that repo,
so dependency resolution fails before compilation even starts without this.

Usage:
    mock -r packaging/fedora/mock-fedora-44-x86_64-rpmfusion.cfg \
         --buildsrpm --spec packaging/fedora/bambu-studio.spec \
         --sources . --resultdir /tmp/mock-result
    mock -r packaging/fedora/mock-fedora-44-x86_64-rpmfusion.cfg \
         --rebuild /tmp/mock-result/bambu-studio-*.src.rpm --resultdir /tmp/mock-result
"""

# Include the full generated base chroot config (not a lower-level .tpl
# fragment) so this stays correct regardless of how mock's template chain is
# internally organized. Confirm the path with `mock -l` after installing mock
# if this file is missing on your system (e.g. a different Fedora version).
include('/etc/mock/fedora-44-x86_64.cfg')

config_opts['root'] = 'fedora-44-x86_64-rpmfusion'
config_opts['description'] = 'Fedora 44 x86_64 + RPM Fusion Free (for BambuStudio)'

config_opts['dnf.conf'] += """
[rpmfusion-free]
name=RPM Fusion for Fedora $releasever - Free
baseurl=https://download1.rpmfusion.org/free/fedora/releases/$releasever/Everything/$basearch/os/
gpgcheck=1
gpgkey=https://download1.rpmfusion.org/free/fedora/RPM-GPG-KEY-rpmfusion-free-$releasever
skip_if_unavailable=False
"""
